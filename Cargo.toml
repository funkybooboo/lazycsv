[package]
name = "lazycsv"
version = "0.22.1"
edition = "2021"
description = "A blazingly fast terminal UI for viewing and editing CSV files"
authors = ["Nate Stott <nate.stott@pm.me>", "Dana Stott <danastott@gmail.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/funkybooboo/lazycsv"
homepage = "https://github.com/funkybooboo/lazycsv"
keywords = ["csv", "terminal", "tui", "vim", "cli"]
categories = ["command-line-utilities", "visualization"]
readme = "README.md"

[dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
csv = "1.3"
anyhow = "1.0"
clap = { version = "4.5.4", features = ["derive"] }
encoding_rs = "0.8.33"
duckdb = { version = "1.2", features = ["bundled"] }
libc = "0.2"
regex = "1"
memmap2 = "0.9"
lru = "0.16"
memchr = "2"
chrono = "0.4"
rayon = "1.10"
calamine = { version = "0.34.0", features = ["dates"] }
sqlformat = "0.5.0"
toml = "1.0.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
rand = "0.10"
rust_xlsxwriter = "0.94"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dev-dependencies]
tempfile = "3.10.1"
proptest = "1.4"
criterion = "0.5"

[[bench]]
name = "navigation"
harness = false

[[bench]]
name = "rendering"
harness = false

[[bench]]
name = "search"
harness = false

[[bench]]
name = "sql"
harness = false
