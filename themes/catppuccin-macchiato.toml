# Catppuccin Macchiato — Catppuccin
# https://catppuccin.com/
#
# Soothing pastel theme — Macchiato sits between Mocha and Frappé in darkness.

[ui]
fg        = "#cad3f5"
bg        = "#24273a"
border_fg = "#5b6078"

[table]
header_fg       = "#c6a0f6"
header_bg       = "#1e2030"
header_bold     = true
zebra_bg        = "#363a4f"
cursor_fg       = "#24273a"
cursor_bg       = "#f5bde6"
selection_fg    = "#cad3f5"
selection_bg    = "#494d64"
search_match_fg = "#24273a"
search_match_bg = "#eed49f"
dirty_fg        = "#ed8796"

[popup]
bg                = "#363a4f"
fg                = "#cad3f5"
border_fg         = "#5b6078"
title_fg          = "#c6a0f6"
completion_sel_fg = "#24273a"
completion_sel_bg = "#8aadf4"

[status]
fg         = "#cad3f5"
bg         = "#1e2030"
mode_fg    = "#24273a"
mode_bg    = "#a6da95"
error_fg   = "#ed8796"
success_fg = "#a6da95"

[file_menu]
dir_fg              = "#8aadf4"
highlight_fg        = "#cad3f5"
highlight_bg        = "#494d64"
separator_fg        = "#5b6078"
status_bg           = "#1e2030"
status_mode_bg      = "#8aadf4"
status_accent_bg    = "#f5bde6"
active_indicator_fg = "#a6da95"
preview_cols = [
  "#8aadf4", "#a6da95", "#eed49f", "#8bd5ca",
  "#c6a0f6", "#ed8796", "#f5a97f", "#91d7e3",
]

[sql]
line_number_fg        = "#6e738d"
diagnostic_error_fg   = "#ed8796"
diagnostic_warning_fg = "#eed49f"
