# Solarized Light — Ethan Schoonover
# https://ethanschoonover.com/solarized/
#
# Light variant of Solarized — cream background tuned for daylight viewing.

[ui]
fg        = "#657b83"
bg        = "#fdf6e3"
border_fg = "#93a1a1"

[table]
header_fg       = "#b58900"
header_bg       = "#eee8d5"
header_bold     = true
zebra_bg        = "#eee8d5"
cursor_fg       = "#fdf6e3"
cursor_bg       = "#268bd2"
selection_fg    = "#586e75"
selection_bg    = "#93a1a1"
search_match_fg = "#fdf6e3"
search_match_bg = "#b58900"
dirty_fg        = "#dc322f"

[popup]
bg                = "#eee8d5"
fg                = "#586e75"
border_fg         = "#93a1a1"
title_fg          = "#b58900"
completion_sel_fg = "#fdf6e3"
completion_sel_bg = "#268bd2"

[status]
fg         = "#657b83"
bg         = "#eee8d5"
mode_fg    = "#fdf6e3"
mode_bg    = "#859900"
error_fg   = "#dc322f"
success_fg = "#859900"

[file_menu]
dir_fg              = "#268bd2"
highlight_fg        = "#fdf6e3"
highlight_bg        = "#268bd2"
separator_fg        = "#93a1a1"
status_bg           = "#eee8d5"
status_mode_bg      = "#268bd2"
status_accent_bg    = "#d33682"
active_indicator_fg = "#859900"
preview_cols = [
  "#268bd2", "#859900", "#b58900", "#2aa198",
  "#d33682", "#dc322f", "#cb4b16", "#6c71c4",
]

[sql]
line_number_fg        = "#93a1a1"
diagnostic_error_fg   = "#dc322f"
diagnostic_warning_fg = "#b58900"
